services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: smartdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartdesk}
    ports:
      - "5432:5432"
    volumes:
      - smartdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 전체 스택 실행: docker compose --profile app up --build
  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartdesk
      DB_USERNAME: smartdesk
      DB_PASSWORD: ${DB_PASSWORD:-smartdesk}
      JWT_SECRET: ${JWT_SECRET:-c21hcnRkZXNrLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS0zMi1ieXRlcw==}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      ATTACHMENT_DIR: /app/var/attachments
    volumes:
      - smartdesk_attachments:/app/var/attachments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    profiles: ["app"]
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  # 단계 1: 티켓 분류 서빙. docker compose --profile ml up --build ml
  # (빌드 중 데이터셋 다운로드 + 모델 학습). backend 는 CLASSIFICATION_PROVIDER=ml 로 연동.
  ml:
    profiles: ["ml", "app"]
    build:
      context: ./analytics
      dockerfile: service/Dockerfile
    ports:
      - "8000:8000"

volumes:
  smartdesk_pg:
  smartdesk_attachments:
