spring:
  datasource:
    # 기본: PgVectorContainer 가 pgvector/pgvector:pg17 컨테이너를 띄우고 @DynamicPropertySource 로 주입.
    #   (단계 2 의 V7 이 CREATE EXTENSION vector 를 하므로 순정 postgres 이미지로는 부팅 실패.)
    # 로컬 PostgreSQL(+pgvector) 을 쓰려면 아래를 모두 오버라이드:
    #   TEST_DB_URL=jdbc:postgresql://localhost:5432/smartdesk_test
    #   TEST_DB_DRIVER=org.postgresql.Driver  TEST_DB_USERNAME=smartdesk  TEST_DB_PASSWORD=smartdesk
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/smartdesk_test}
    driver-class-name: ${TEST_DB_DRIVER:org.postgresql.Driver}
    username: ${TEST_DB_USERNAME:smartdesk}
    password: ${TEST_DB_PASSWORD:smartdesk}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    clean-disabled: false
    # 로컬 PG 오버라이드 시: Flyway 는 소유자 커넥션 (컨테이너 실행 시엔 PgVectorContainer 가 주입)
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/smartdesk_test}
    user: ${TEST_DB_USERNAME:smartdesk}
    password: ${TEST_DB_PASSWORD:smartdesk}

smartdesk:
  jwt:
    secret: c21hcnRkZXNrLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS0zMi1ieXRlcw==
    access-token-ttl-seconds: 3600
  sla:
    business-hours-only: false
  storage:
    dir: ./var/test-attachments
  rag:
    embed-url: ${RAG_EMBED_URL:http://localhost:8000}
    enabled: false          # 테스트에서 임베딩 서비스 호출 안 함 (인덱싱은 단위/모킹으로 검증)
