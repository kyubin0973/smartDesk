# 운영 프로파일 예시. SPRING_PROFILES_ACTIVE=prod 로 활성화.
# 아래 값은 모두 환경변수로 주입 — 이미지/리포지토리에 시크릿을 넣지 말 것.
spring:
  datasource:
    url: ${DB_URL}                # jdbc:postgresql://<host>:5432/smartdesk
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    # 단계 4: 마이그레이션은 소유자, 앱 커넥션은 RlsDataSource 가 smartdesk_app 롤로 SET ROLE (RLS 적용)
    url: ${DB_URL}
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}

server:
  # 리버스 프록시/인그레스에서 TLS 종료 → X-Forwarded-* 신뢰
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

smartdesk:
  jwt:
    secret: ${JWT_SECRET}         # 미설정 시 부팅 거부 (JwtService)
    access-token-ttl-seconds: ${JWT_TTL:3600}
  cors:
    allowed-origins: ${SMARTDESK_CORS_ALLOWED_ORIGINS}   # 예: https://desk.example.com
  storage:
    dir: ${ATTACHMENT_DIR:/app/var/attachments}          # 다중 인스턴스면 S3/NFS 등 공유 스토리지로 교체
  sla:
    business-hours-only: ${SLA_BUSINESS_HOURS:false}
  password:
    reset-url-base: ${PASSWORD_RESET_URL_BASE}   # 예: https://desk.example.com/reset-password
    expose-reset-token: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
