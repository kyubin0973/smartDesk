spring:
  application:
    name: smartdesk-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartdesk}
    username: ${DB_USERNAME:smartdesk}
    password: ${DB_PASSWORD:smartdesk}
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 Flyway 가 관리
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/liveness · /readiness (k8s)
  metrics:
    tags:
      application: smartdesk-backend

smartdesk:
  jwt:
    # 운영(prod 프로파일)에서는 반드시 JWT_SECRET 환경변수로 교체 (Base64 디코딩 시 32바이트 이상). 미설정 시 부팅 거부.
    secret: ${JWT_SECRET:c21hcnRkZXNrLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS0zMi1ieXRlcw==}
    access-token-ttl-seconds: 3600
    revocation-reload-ms: 300000   # 폐기 토큰 집합 재로드 주기 (다중 인스턴스 최종 일관성)
  sla:
    # REQ-F-011: 계약 sla_resolution_min 기준 마감시각 계산.
    business-hours-only: false     # true 로 켜면 아래 영업시간만 카운트 (평일 09-18 Asia/Seoul)
    business-zone: Asia/Seoul
    business-day-start: 9
    business-day-end: 18
    monitor-interval-ms: 300000   # SLA 임박/초과 스캔 주기 (5분)
    escalation-l2-minutes: 60      # 초과 1시간 → 부서 관리자에게 확대
    escalation-l3-minutes: 240     # 초과 4시간 → 전체 관리자에게 확대
  contract:
    status-cron: "0 10 0 * * *"   # 계약 상태 전이 (매일 00:10 UTC)
  password:
    reset-url-base: ${PASSWORD_RESET_URL_BASE:http://localhost:5173/reset-password}
    reset-ttl-minutes: 30
    min-length: 8
    expose-reset-token: true      # dev 편의: 응답에 devResetToken 포함. prod 프로파일에서 false
  mail:
    from: ${MAIL_FROM:no-reply@smartdesk.io}
  notifications:
    # 이 유형은 인앱 + 이메일. spring.mail.host 미설정 시 이메일은 로그로만.
    email-types: SLA_BREACHED,SLA_DUE_SOON,TICKET_ASSIGNED
    slack-types: SLA_BREACHED
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    sse-heartbeat-ms: 25000        # 0.5-b: 실시간 알림 SSE keep-alive 주기

# 이메일 발송하려면 아래를 설정 (미설정 시 로그 어댑터):
# spring.mail.host / port / username / password / properties.mail.smtp.auth 등
  storage:
    dir: ${ATTACHMENT_DIR:./var/attachments}
  classification:
    # 단계 1.3: rule | ml. ml 은 analytics/service(FastAPI) 호출, 실패·저신뢰 시 rule 로 폴백.
    provider: ${CLASSIFICATION_PROVIDER:rule}
    ml-url: ${CLASSIFICATION_ML_URL:http://localhost:8000}
    ml-min-confidence: 0.55
    ml-timeout-ms: 800
    # ML 모델(HF 데이터셋 학습) queue 라벨 → SmartDesk 카테고리명. 없는 라벨은 규칙 기반 폴백.
    # 운영에서는 자체 티켓 라벨로 재학습하면 이 매핑이 불필요.
    queue-map:
      "[IT Support]": Access
      "[Technical Support]": Application
      "[Product Support]": Application
      "[Service Outages and Maintenance]": Application
      "[Billing and Payments]": Purchase
      "[Sales and Pre-Sales]": Purchase
      "[Returns and Exchanges]": Purchase
  rag:
    # 단계 2: 벡터 검색 + RAG 초안. true 로 켜면 analytics/service(/embed) 필요.
    enabled: ${RAG_ENABLED:false}
    embed-url: ${RAG_EMBED_URL:http://localhost:8000}
    embed-timeout-ms: 20000
    top-k: 5
    chunk-chars: 600
    reconcile-cron: "0 */10 * * * *"
    llm:
      # none | anthropic. anthropic 이면 ANTHROPIC_API_KEY(또는 아래 api-key) 필요.
      provider: ${RAG_LLM_PROVIDER:none}
      model: ${RAG_LLM_MODEL:claude-opus-5}
      max-tokens: 1500
      api-key: ${RAG_LLM_API_KEY:}

logging:
  level:
    org.hibernate.SQL: info
