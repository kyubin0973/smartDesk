# 단계 4: 운영 스택. 값은 .env 로 주입 (git 에 올리지 말 것).
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile ml up -d --build   # + AI 서빙
#
# 앞단에 TLS 리버스 프록시(Caddy/Traefik/nginx)를 두고 frontend:80 으로 프록시하세요.
# 이 파일은 호스트에 포트를 최소로만 노출합니다.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: ${DB_USERNAME:-smartdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
    volumes:
      - smartdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-smartdesk}"]
      interval: 10s
      timeout: 3s
      retries: 12
    # 포트 미노출 — backend 만 접근

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/smartdesk
      DB_USERNAME: ${DB_USERNAME:-smartdesk}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요 (openssl rand -base64 48)}
      SMARTDESK_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?예: https://desk.example.com}
      PASSWORD_RESET_URL_BASE: ${PUBLIC_ORIGIN}/reset-password
      SMARTDESK_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 메일 (미설정 시 재설정·알림 메일은 로그로만)
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USER:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      # AI (ml 프로파일과 함께 켤 때)
      CLASSIFICATION_PROVIDER: ${CLASSIFICATION_PROVIDER:-rule}
      CLASSIFICATION_ML_URL: http://ml:8000
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_EMBED_URL: http://ml:8000
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-none}
      RAG_LLM_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 첨부 스토리지 (기본 로컬 볼륨; S3 는 아래 주석 해제)
      ATTACHMENT_DIR: /app/var/attachments
      # SMARTDESK_STORAGE_TYPE: s3
      # SMARTDESK_STORAGE_S3_BUCKET: ${S3_BUCKET:-}
      # SMARTDESK_STORAGE_S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - smartdesk_attachments:/app/var/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"   # 리버스 프록시가 여기로 프록시

  ml:
    profiles: ["ml"]
    build:
      context: ./analytics
      dockerfile: service/Dockerfile
    restart: unless-stopped

volumes:
  smartdesk_pg:
  smartdesk_attachments:
